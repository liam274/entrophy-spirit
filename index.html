<html>
	<head>
		<link rel="stylesheet" href="main.css" />
		<title>熵零記: Entropy Spirit</title>
	</head>
	<body>
		<span id="spirit"></span>
		<textarea
			id="blackboard"
			readonly
			placeholder="Spirit's little note"
		></textarea>
		<div id="toolbar">
			<button class="button" id="pen">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					fill="none"
					viewBox="0 0 24 24"
					stroke-width="1.5"
					stroke="currentColor"
					class="size-6"
				>
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"
					/>
				</svg>
			</button>
			<button class="button" id="eraser">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					fill="none"
					viewBox="0 0 24 24"
					stroke-width="1.5"
					stroke="currentColor"
					class="size-6"
				>
					<!-- Eraser Body -->
					<path d="M5 5h14v12l-14 2V5z" />

					<!-- Eraser Sleeve/Wrapper -->
					<path d="M5 10h14v3H5z" />

					<!-- Eraser Dust / Shavings -->
					<path d="M17 20c.5-1 1.5-1 2 0" />
					<path d="M21 18c.5-.5 1-.5 1.5 0" />
					<circle
						cx="16"
						cy="21"
						r="0.5"
						fill="currentColor"
						stroke="none"
					/>
					<circle
						cx="18.5"
						cy="21.5"
						r="0.5"
						fill="currentColor"
						stroke="none"
					/>
					<circle
						cx="20.5"
						cy="20"
						r="1"
						fill="currentColor"
						stroke="none"
					/>
				</svg>
			</button>
			<button class="button" id="dump-all">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					fill="none"
					viewBox="0 0 24 24"
					stroke-width="1.5"
					stroke="currentColor"
					class="size-6"
				>
					<path
						stroke-linecap="round"
						stroke-linejoin="round"
						d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
					/>
				</svg>
			</button>
		</div>
	</body>
	<script src="main.js" defer></script>
</html>
